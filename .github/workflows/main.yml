name: Build Flip Clock APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check required files
        run: |
          ls -la
          for f in index.html app.js styles.css icons.py native.py package.json capacitor.config.json; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing file in the repo root: $f"
              exit 1
            fi
          done

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Prepare web files
        run: |
          mkdir -p www/fonts www/icons
          cp index.html app.js styles.css www/
          for w in 300 400 500 600 700; do cp node_modules/@fontsource/inter/files/inter-latin-$w-normal.woff2 www/fonts/inter-$w.woff2; done
          for w in 500 700 800; do cp node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-$w-normal.woff2 www/fonts/jetbrains-mono-$w.woff2; done
          BEBAS="$(find node_modules/@fontsource/bebas-neue/files -name 'bebas-neue-latin-400-normal.woff2' | head -n 1)"
          if [ -n "$BEBAS" ]; then cp "$BEBAS" www/fonts/bebas-neue-400.woff2; else echo "::warning::Bebas Neue font not found - using a fallback font"; fi
          pip install pillow || pip install --break-system-packages pillow
          cd www && python3 ../icons.py

      - name: Create Android project
        run: |
          rm -rf android
          npx cap add android

      - name: Add alarm engine, widgets and shortcuts
        run: python3 native.py

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FlipClock-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
